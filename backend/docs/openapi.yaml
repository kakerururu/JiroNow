openapi: "3.0.3"
info:
  title: JiroNow API
  version: "1.0"

paths:
  /status:
    get:
      description: "Return the status of a store based on thr specified account's tweets"
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
          description: "Store's Twitter account ID"
      responses:
        "200":
          $ref: "#/components/responses/GetStoreStatusResponse"
        "400":
          $ref: "#/components/responses/InvalidAccountResponse"
        "500":
          $ref: "#/components/responses/UnprocessableStoreStatusResponse"

components:
  responses:
    GetStoreStatusResponse:
      description: "Store status response"
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [open, closed]

    InternalSreverErrorResponse:
      description: "Error response"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
