openapi: "3.0.3"
info:
  title: JiroNow API
  version: "1.0"

paths:
  /stores/{storeName}/status:
    get:
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: "#/components/responses/StoreStatusResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  responses:
    StoreStatusResponse:
      description: "Store status response"
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [open, closed]

    ErrorResponse:
      description: "Error response"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
