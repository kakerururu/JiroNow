openapi: "3.0.3"
info:
  title: JiroNow API
  version: "1.0"

paths:
  /store/status:
    get:
      description: "Determines if a store is open or closed by analyzing posts associated with a given account."
      parameters:
        - name: xAccountId
          in: query
          required: true
          schema:
            type: string
          description: "Store's Twitter account ID"
      responses:
        "200":
          $ref: "#/components/responses/GetStoreStatusResponse"
        "404":
          $ref: "#/components/responses/AccountNotFoundResponse"
        "520":
          $ref: "#/components/responses/UnprocessableStoreStatusResponse"

components:
  responses:
    GetStoreStatusResponse:
      description: "Store status response"
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [open, closed]

    AccountNotFoundResponse:
      description: "the specified account does not exist"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    UnprocessableStoreStatusResponse:
      description: "Unable to determine store status from the specified account's information"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
