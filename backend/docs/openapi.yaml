openapi: "3.0.3"
info:
  title: JiroNow API
  version: "1.0"

paths:
  /stores/{storeName}/status:
    get:
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Store status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatusResponse"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    StoreStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
